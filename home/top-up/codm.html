<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call of Duty CP Top-Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-header img.logo {
      width: 50px;
    }

    .banner {
      width: 100%;
      height: 200px;
      background: url('codm-banner.jpg') no-repeat center center/cover;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .user-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .user-info input {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background: #1e1e2d;
      color: #fff;
    }

    .cp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .cp-card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.3s ease;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .cp-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('cp-bg.jpg') no-repeat center center/cover;
      opacity: 0.12;
      z-index: 0;
    }

    .cp-card * {
      position: relative;
      z-index: 1;
    }

    .cp-card:hover,
    .cp-card.active {
      border-color: #ffcc00;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .cp-card img {
      width: 60px;
      margin-bottom: 10px;
    }

    .cp-card span {
      display: block;
      font-size: 14px;
    }

    .buy-area {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .buy-area label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .buy-area button {
      padding: 12px 30px;
      font-size: 16px;
      background: #ffcc00;
      border: none;
      border-radius: 6px;
      color: black;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .buy-area button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .cp-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-header">
      <div class="header-text">Call of Duty CP Top-Up</div>
      <img src="logo.png" alt="Logo" class="logo">
    </div>

    <div class="banner"></div>

    <div class="user-info">
      <input type="text" id="playerId" placeholder="Enter your CODM UID">
      <input type="email" id="email" placeholder="Enter your Gmail">
    </div>

    <div class="cp-grid" id="cpGrid"></div>

    <div class="buy-area">
      <label>
        <input type="checkbox" id="terms"> I agree to the Terms & Conditions
      </label>
      <button id="buyBtn" disabled>Buy Now</button>
    </div>
  </div>

  <script>
    const cpOptions = [
      { amount: '30', bonus: '0' },
      { amount: '88', bonus: '8' },
      { amount: '160', bonus: '80' },
      { amount: '460', bonus: '60' },
      { amount: '960', bonus: '160' },
      { amount: '2600', bonus: '600' },
    ];

    const cpGrid = document.getElementById('cpGrid');
    const buyBtn = document.getElementById('buyBtn');
    const playerIdInput = document.getElementById('playerId');
    const emailInput = document.getElementById('email');
    const termsCheck = document.getElementById('terms');

    let selectedCP = null;

    cpOptions.forEach((cp) => {
      const card = document.createElement('div');
      card.className = 'cp-card';
      card.innerHTML = `
        <img src="cp-icon.png" alt="CP">
        <h3>${parseInt(cp.amount) + parseInt(cp.bonus)} CP</h3>
        <span>(${cp.amount} + ${cp.bonus} Bonus)</span>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.cp-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedCP = cp;
        validateForm();
      });
      cpGrid.appendChild(card);
    });

    [playerIdInput, emailInput, termsCheck].forEach(el => {
      el.addEventListener('input', validateForm);
      el.addEventListener('change', validateForm);
    });

    function validateForm() {
      if (
        playerIdInput.value.trim() !== '' &&
        emailInput.value.trim() !== '' &&
        termsCheck.checked &&
        selectedCP
      ) {
        buyBtn.disabled = false;
      } else {
        buyBtn.disabled = true;
      }
    }

    buyBtn.addEventListener('click', () => {
      alert(`UID: ${playerIdInput.value}\nEmail: ${emailInput.value}\nSelected: ${parseInt(selectedCP.amount) + parseInt(selectedCP.bonus)} CP`);
      // Save to database later + link payment system
    });
  </script>
</body>
</html>
