<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Robux Top-Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d12;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-header img.logo {
      width: 50px;
    }

    .banner {
      width: 100%;
      height: 200px;
      background: url('roblox-banner.jpg') no-repeat center center/cover;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .user-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .user-info input {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background: #1e1e2d;
      color: #fff;
    }

    .gem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .gem-card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.3s ease;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .gem-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('robux-bg.jpg') no-repeat center center/cover;
      opacity: 0.12;
      z-index: 0;
    }

    .gem-card * {
      position: relative;
      z-index: 1;
    }

    .gem-card:hover,
    .gem-card.active {
      border-color: #00ff88;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .gem-card img {
      width: 60px;
      margin-bottom: 10px;
    }

    .gem-card span {
      display: block;
      font-size: 14px;
    }

    .buy-area {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .buy-area label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .buy-area button {
      padding: 12px 30px;
      font-size: 16px;
      background: #00ff88;
      border: none;
      border-radius: 6px;
      color: black;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .buy-area button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .gem-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-header">
      <div class="header-text">Roblox Robux Top-Up</div>
      <img src="logo.png" alt="Logo" class="logo">
    </div>

    <div class="banner"></div>

    <div class="user-info">
      <input type="text" id="playerId" placeholder="Enter your Roblox Username">
      <input type="email" id="email" placeholder="Enter your Gmail">
    </div>

    <div class="gem-grid" id="gemGrid"></div>

    <div class="buy-area">
      <label>
        <input type="checkbox" id="terms"> I agree to the Terms & Conditions
      </label>
      <button id="buyBtn" disabled>Buy Now</button>
    </div>
  </div>

  <script>
    const gemOptions = [
      { amount: '80', bonus: '0' },
      { amount: '400', bonus: '40' },
      { amount: '800', bonus: '80' },
      { amount: '1700', bonus: '150' },
      { amount: '4500', bonus: '500' },
      { amount: '10000', bonus: '1000' },
    ];

    const gemGrid = document.getElementById('gemGrid');
    const buyBtn = document.getElementById('buyBtn');
    const playerIdInput = document.getElementById('playerId');
    const emailInput = document.getElementById('email');
    const termsCheck = document.getElementById('terms');

    let selectedGem = null;

    gemOptions.forEach((g) => {
      const card = document.createElement('div');
      card.className = 'gem-card';
      card.innerHTML = `
        <img src="robux-icon.png" alt="Robux">
        <h3>${parseInt(g.amount) + parseInt(g.bonus)} Robux</h3>
        <span>(${g.amount} + ${g.bonus} Bonus)</span>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.gem-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedGem = g;
        validateForm();
      });
      gemGrid.appendChild(card);
    });

    [playerIdInput, emailInput, termsCheck].forEach(el => {
      el.addEventListener('input', validateForm);
      el.addEventListener('change', validateForm);
    });

    function validateForm() {
      if (
        playerIdInput.value.trim() !== '' &&
        emailInput.value.trim() !== '' &&
        termsCheck.checked &&
        selectedGem
      ) {
        buyBtn.disabled = false;
      } else {
        buyBtn.disabled = true;
      }
    }

    buyBtn.addEventListener('click', () => {
      alert(`Username: ${playerIdInput.value}\nEmail: ${emailInput.value}\nSelected: ${parseInt(selectedGem.amount) + parseInt(selectedGem.bonus)} Robux`);
      // Save to database later + link payment system
    });
  </script>
</body>
</html>
