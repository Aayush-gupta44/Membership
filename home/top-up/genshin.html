<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Impact Genesis Crystal Top-Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #101020;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-header img.logo {
      width: 50px;
    }

    .banner {
      width: 100%;
      height: 200px;
      background: url('genshin-banner.jpg') no-repeat center center/cover;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .user-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .user-info input {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background: #1e1e2d;
      color: #fff;
    }

    .crystal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }

    .crystal-card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.3s ease;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .crystal-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('genshin-bg.jpg') no-repeat center center/cover;
      opacity: 0.15;
      z-index: 0;
    }

    .crystal-card * {
      position: relative;
      z-index: 1;
    }

    .crystal-card:hover,
    .crystal-card.active {
      border-color: #00d1ff;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .crystal-card img {
      width: 60px;
      margin-bottom: 10px;
    }

    .crystal-card span {
      display: block;
      font-size: 14px;
    }

    .buy-area {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .buy-area label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .buy-area button {
      padding: 12px 30px;
      font-size: 16px;
      background: #00d1ff;
      border: none;
      border-radius: 6px;
      color: black;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .buy-area button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .crystal-grid {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-header">
      <div class="header-text">Genshin Impact Top-Up</div>
      <img src="logo.png" alt="Logo" class="logo">
    </div>

    <div class="banner"></div>

    <div class="user-info">
      <input type="text" id="playerId" placeholder="Enter your Genshin UID">
      <input type="email" id="email" placeholder="Enter your Gmail">
    </div>

    <div class="crystal-grid" id="crystalGrid"></div>

    <div class="buy-area">
      <label>
        <input type="checkbox" id="terms"> I agree to the Terms & Conditions
      </label>
      <button id="buyBtn" disabled>Buy Now</button>
    </div>
  </div>

  <script>
    const crystals = [
      { amount: '60', bonus: '0' },
      { amount: '300', bonus: '30' },
      { amount: '980', bonus: '110' },
      { amount: '1980', bonus: '260' },
      { amount: '3280', bonus: '600' },
      { amount: '6480', bonus: '1600' },
    ];

    const crystalGrid = document.getElementById('crystalGrid');
    const buyBtn = document.getElementById('buyBtn');
    const playerIdInput = document.getElementById('playerId');
    const emailInput = document.getElementById('email');
    const termsCheck = document.getElementById('terms');

    let selectedCrystal = null;

    crystals.forEach((c) => {
      const card = document.createElement('div');
      card.className = 'crystal-card';
      card.innerHTML = `
        <img src="crystal-icon.png" alt="Genesis Crystal">
        <h3>${parseInt(c.amount) + parseInt(c.bonus)} Crystals</h3>
        <span>(${c.amount} + ${c.bonus} Bonus)</span>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.crystal-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedCrystal = c;
        validateForm();
      });
      crystalGrid.appendChild(card);
    });

    [playerIdInput, emailInput, termsCheck].forEach(el => {
      el.addEventListener('input', validateForm);
      el.addEventListener('change', validateForm);
    });

    function validateForm() {
      if (
        playerIdInput.value.trim() !== '' &&
        emailInput.value.trim() !== '' &&
        termsCheck.checked &&
        selectedCrystal
      ) {
        buyBtn.disabled = false;
      } else {
        buyBtn.disabled = true;
      }
    }

    buyBtn.addEventListener('click', () => {
      alert(`UID: ${playerIdInput.value}\nEmail: ${emailInput.value}\nSelected: ${parseInt(selectedCrystal.amount) + parseInt(selectedCrystal.bonus)} Crystals`);
      // Save to database later + link payment system
    });
  </script>
</body>
</html>
