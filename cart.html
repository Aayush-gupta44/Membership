<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - Gaming Accessories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fff; font-family: 'Segoe UI', sans-serif; }
    .warning-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ffc107; color: #000; padding: 10px 20px;
      border-radius: 6px; display: none; z-index: 9999;
    }
  </style>
</head>
<body>
<div class="container my-4">
  <h3>Your Cart</h3>
  <div class="row">
    <div class="col-lg-8">
      <ul id="cartList" class="list-group mb-4"></ul>
    </div>
    <div class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h5>Order Summary</h5>
          <p>Subtotal: Rs. <span id="subtotal">0</span></p>
          <input type="text" class="form-control mb-2" placeholder="Enter Voucher Code" />
          <button class="btn btn-primary w-100 mb-2">Apply</button>
          <button onclick="checkout()" class="btn btn-success w-100">Proceed to Checkout</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="warning-toast" id="warningToast">Please select items</div>

<script>
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const cartList = document.getElementById('cartList');
  const subtotalEl = document.getElementById('subtotal');

  function renderCart() {
    cartList.innerHTML = '';
    let subtotal = 0;
    cart.forEach(item => {
      subtotal += item.price * item.qty;
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center';
      li.innerHTML = `
        <div>
          <img src=\"${item.image}\" width=\"60\" class=\"me-2\">
          ${item.name} <br>
          Rs. ${item.price} × ${item.qty}
        </div>
        <div>
          <button class=\"btn btn-outline-secondary btn-sm\" onclick=\"updateQty(${item.id}, -1)\">-</button>
          <button class=\"btn btn-outline-secondary btn-sm\" onclick=\"updateQty(${item.id}, 1)\">+</button>
          <button class=\"btn btn-danger btn-sm\" onclick=\"removeItem(${item.id})\">🗑</button>
        </div>`;
      cartList.appendChild(li);
    });
    subtotalEl.textContent = subtotal;
  }

  function updateQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) removeItem(id);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
  }

  function removeItem(id) {
    const index = cart.findIndex(i => i.id === id);
    if (index !== -1) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }
  }

  function checkout() {
    if (cart.length === 0) {
      const toast = document.getElementById('warningToast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 1000);
    } else {
      alert('Proceeding to checkout...');
    }
  }

  renderCart();
</script>
</body>
</html>
